name: retry failed build
on:
  workflow_run:
    workflows: [bluebuild]
    types: [completed]
    branches: [main]

jobs:
  retry:
    name: Re-run failed build once
    # first attempt only, so a real breakage still fails twice and stays red;
    # PR builds are left alone
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Wait for mirrors to settle, then re-run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          sleep 1200

          attempt=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq .run_attempt)
          if [ "$attempt" -gt 1 ]; then
            echo "run $RUN_ID is already on attempt $attempt; not re-running"
            exit 0
          fi

          head_sha=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [ "$head_sha" != "$RUN_SHA" ]; then
            echo "main moved on to $head_sha; not re-running $RUN_SHA"
            exit 0
          fi

          gh run rerun "$RUN_ID" --failed

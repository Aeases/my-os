context.properties = {
    log.level = 0
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
{   name = libpipewire-module-rt
    args = { }
    flags = [ ifexists nofail ]
}
{   name = libpipewire-module-protocol-native }
{   name = libpipewire-module-client-node }
{   name = libpipewire-module-adapter }

{   name = libpipewire-module-filter-chain
    args = {
        node.description = "Mic (DeepFilter)"
        media.name       = "Mic (DeepFilter)"
        filter.graph = {
            nodes = [
                {   type   = ladspa
                    name   = deepfilter
                    plugin = /usr/lib/ladspa/libdeep_filter_ladspa.so
                    label  = deep_filter_mono
                    # 100 = no limit (strongest). Lower (e.g. 24) if voice sounds processed.
                    control = { "Attenuation Limit (dB)" = 100 }
                }
            ]
        }
        audio.rate     = 48000
        audio.position = [ MONO ]
        capture.props = {
            node.name    = "deepfilter_mic.capture"
            node.passive = true
        }
        playback.props = {
            node.name         = "deepfilter_mic"
            media.class       = Audio/Source
            filter.smart      = true
            filter.smart.name = "deepfilter-mic"
        }
    }
}
]

# From crispywaffles666/bazzite-niri@b15799902cd4, files/system/usr/lib/tmpfiles.d/tuigreet.conf
# https://github.com/crispywaffles666/bazzite-niri/blob/b15799902cd4/files/system/usr/lib/tmpfiles.d/tuigreet.conf
# Fedora stores tuigreet's saved login under /var/lib/greetd. OSTree does not
# ship /var, and Fedora's tmpfiles rule only relabels an existing directory.
# Create it here with the xdm_var_lib_t label that greetd may write to.
d /var/lib/greetd 0755 greetd greetd -

# From ublue-os/bazzite@3d925606da7a, system_files/desktop/shared/usr/share/ublue-os/just/84-bazzite-virt.just
# https://github.com/ublue-os/bazzite/blob/3d925606da7a/system_files/desktop/shared/usr/share/ublue-os/just/84-bazzite-virt.just
# ("Making sure swtpm will work": mkdir /var/lib/swtpm-localca, chown tss), as a tmpfiles entry
d /var/lib/swtpm-localca 0755 tss root -

# In the format rpm-ostree generates for packages' /var content (rpm-ostree-autovar.conf), from
# coreos/rpm-ostree@e5f67f1be7df, rust/src/tmpfiles.rs:84; modes and owners as packaged by
# libvirt-daemon-driver-qemu, libvirt-daemon-common, cups and blueman (rpm -qlv)
# https://github.com/coreos/rpm-ostree/blob/e5f67f1be7df/rust/src/tmpfiles.rs#L84
d /var/lib/libvirt/images 0711 root root - -
d /var/lib/libvirt/boot 0711 root root - -
d /var/lib/libvirt/filesystems 0711 root root - -
d /var/lib/libvirt/swtpm 0711 root root - -
d /var/lib/libvirt/network 0700 root root - -
d /var/cache/cups 0770 root lp - -
d /var/cache/cups/rss 0775 root lp - -
d /var/lib/blueman 0755 root root - -

---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: my-os
description: My OS image for my framesmith.

base-image: ghcr.io/ublue-os/base-main
image-version: latest # IMAGE VERSION

stages:
  - name: source-builds
    from: registry.fedoraproject.org/fedora:44
    modules:
      - type: script
        scripts:
          - build-from-source.sh # keyd, tofi, wl-clip-persist, patched psst, awww, waypaper, discover-overlay, patched noctalia -> /out

modules:
  - from-file: modules/packages.yml
  - from-file: modules/third-party.yml
  - from-file: modules/drivers.yml
  - from-file: modules/extras.yml
  - from-file: modules/system.yml

  - type: signing

  - type: script
    scripts:
      - tests.sh
